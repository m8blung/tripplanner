<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即時旅伴同步 App</title>
  <style>
    /* 基礎美化樣式 */
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background-color: #f5f7fa;
      padding: 20px; 
      max-width: 500px; 
      margin: 0 auto; 
    }
    .hidden { display: none; }
    .card { 
      background: white; 
      padding: 25px; 
      border-radius: 12px; 
      box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
      margin-bottom: 20px; 
    }
    h2, h3 { color: #333; text-align: center; }
    input { 
      padding: 12px; 
      margin: 10px 0; 
      width: 100%; 
      box-sizing: border-box; 
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 16px;
    }
    button { 
      padding: 12px; 
      margin: 10px 0; 
      width: 100%; 
      box-sizing: border-box; 
      background-color: #4CAF50; 
      color: white; 
      border: none; 
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer; 
      font-weight: bold;
    }
    button:hover { background-color: #45a049; }
    #leave-btn { background-color: #ff4d4d; }
    #leave-btn:hover { background-color: #cc0000; }
    ul { list-style-type: none; padding: 0; }
    li { 
      background: #f1f3f5; 
      margin: 8px 0; 
      padding: 12px; 
      border-radius: 6px; 
      border-left: 4px solid #4CAF50;
    }
    .code-display {
      font-size: 24px;
      color: #007bff;
      font-weight: bold;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

  <h2>✈️ 旅程同步 App</h2>

  <!-- 第一畫面：登入/主畫面 -->
  <div id="home-screen" class="card">
    <h3>建立或加入旅程</h3>
    <button id="create-btn">✨ 創建新旅程</button>
    
    <div style="text-align: center; margin: 15px 0; color: #888;">--- 或 ---</div>
    
    <input type="text" id="join-code-input" placeholder="輸入朋友給的旅程碼 (例如: A1B2C3)">
    <button id="join-btn">🤝 參與旅伴的旅程</button>
  </div>

  <!-- 第二畫面：旅程內容與記帳畫面 -->
  <div id="app-screen" class="card hidden">
    <h3>目前的旅程碼：<br><span id="room-code-display" class="code-display"></span></h3>
    <p style="text-align: center; color: #666; font-size: 14px;">(把這組號碼給朋友，他們就能加進來囉)</p>
    
    <button id="leave-btn">登出 / 離開旅程</button>
    <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
    
    <input type="text" id="item-input" placeholder="輸入行程安排或記帳金額...">
    <button id="add-btn">➕ 新增</button>
    
    <h4 style="margin-top: 20px;">大家的行程與記帳清單：</h4>
    <ul id="item-list">
      <!-- 這裡會即時顯示資料庫的內容 -->
    </ul>
  </div>

  <!-- 引入 Firebase 模組與您的專屬設定 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    // 您的專屬 Firebase 金鑰
    const firebaseConfig = {
      apiKey: "AIzaSyDTIgUaTNIK2AeZvUbsWfRZ9hmaV7JNGWA",
      authDomain: "tripplanner-8dd1a.firebaseapp.com",
      databaseURL: "https://tripplanner-8dd1a-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "tripplanner-8dd1a",
      storageBucket: "tripplanner-8dd1a.firebasestorage.app",
      messagingSenderId: "139484369303",
      appId: "1:139484369303:web:1f5ea1994c1767351e34d2"
    };

    // 初始化 Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 抓取網頁上的元素
    const homeScreen = document.getElementById('home-screen');
    const appScreen = document.getElementById('app-screen');
    const createBtn = document.getElementById('create-btn');
    const joinBtn = document.getElementById('join-btn');
    const joinCodeInput = document.getElementById('join-code-input');
    const roomCodeDisplay = document.getElementById('room-code-display');
    const leaveBtn = document.getElementById('leave-btn');
    const itemInput = document.getElementById('item-input');
    const addBtn = document.getElementById('add-btn');
    const itemList = document.getElementById('item-list');

    let currentRoom = null;

    // 點擊「創建新旅程」：隨機產生一組 6 碼的旅程碼
    createBtn.addEventListener('click', () => {
      const newCode = Math.random().toString(36).substring(2, 8).toUpperCase();
      enterRoom(newCode);
    });

    // 點擊「參與旅伴的旅程」：讀取輸入框的代碼
    joinBtn.addEventListener('click', () => {
      const code = joinCodeInput.value.trim().toUpperCase();
      if (code) {
        enterRoom(code);
      } else {
        alert("請先輸入旅程碼喔！");
      }
    });

    // 點擊「離開旅程」：回到首頁
    leaveBtn.addEventListener('click', () => {
      currentRoom = null;
      joinCodeInput.value = '';
      homeScreen.classList.remove('hidden');
      appScreen.classList.add('hidden');
      itemList.innerHTML = ''; // 清空畫面上的清單
    });

    // 進入旅程房間的核心功能
    function enterRoom(roomCode) {
      currentRoom = roomCode;
      roomCodeDisplay.textContent = currentRoom;
      
      // 切換畫面
      homeScreen.classList.add('hidden');
      appScreen.classList.remove('hidden');

      // 啟動 Firebase 即時監聽功能
      const roomRef = ref(db, 'trips/' + currentRoom);
      onValue(roomRef, (snapshot) => {
        itemList.innerHTML = ''; // 每次資料庫更新時，先清空畫面
        const data = snapshot.val();
        
        if (data) {
          // 如果資料庫有東西，就把每一筆資料變成 <li> 顯示出來
          Object.values(data).forEach(item => {
            const li = document.createElement('li');
            li.textContent = item.text;
            itemList.appendChild(li);
          });
        } else {
          itemList.innerHTML = '<li style="background:transparent; border:none; text-align:center; color:#999;">目前還沒有行程，趕快新增一筆吧！</li>';
        }
      });
    }

    // 點擊「新增」：把輸入的文字推送到 Firebase 資料庫
    addBtn.addEventListener('click', () => {
      const text = itemInput.value.trim();
      if (text && currentRoom) {
        const roomRef = ref(db, 'trips/' + currentRoom);
        const newItemRef = push(roomRef); // 產生一筆有唯一 ID 的新資料
        set(newItemRef, { 
          text: text,
          timestamp: Date.now()
        });
        itemInput.value = ''; // 新增後清空輸入框
      }
    });

    // 支援按 Enter 鍵新增
    itemInput.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        addBtn.click();
      }
    });

  </script>
</body>
</html>
